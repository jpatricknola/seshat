name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    name: Branch up to date with base
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need real history on both sides to test the ancestor relationship.
          fetch-depth: 0

      - name: Assert base branch is merged into this branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")
          if git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "Branch contains origin/$BASE_REF ($BASE_SHA) — up to date."
          else
            BEHIND=$(git rev-list --count "$HEAD_SHA..$BASE_SHA")
            echo "::error::This branch is $BEHIND commit(s) behind origin/$BASE_REF."
            echo "Merge or rebase onto origin/$BASE_REF and push again."
            exit 1
          fi

  test:
    name: Compile, format, test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          # priv/AbletonOSC is the bridge fork. Two test files grep it, and
          # without it they raise in setup_all. Checking it out here also means
          # a pin bumped to a commit that was never pushed fails loudly on the
          # PR instead of reaching another machine as a SHA that exists nowhere.
          submodules: true

      - name: Read .tool-versions
        id: versions
        run: |
          echo "elixir=$(awk '/^elixir /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "otp=$(awk '/^erlang /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.versions.outputs.otp }}-${{ steps.versions.outputs.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.versions.outputs.otp }}-${{ steps.versions.outputs.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused deps
        run: mix deps.unlock --check-unused

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

  # The Ubuntu job above cannot compile AppKit, so the native Accessibility
  # helper would otherwise reach a user's machine having never been built by
  # anyone but its author. This job builds it with the same warnings-as-errors
  # command `mix ax.install` uses (test/mix/tasks/ax_install_test.exs fails if
  # the two drift) and runs the one command that needs neither Live nor granted
  # permission.
  #
  # It proves compilation and structured permission failure. It cannot prove
  # trusted cross-process control: a GitHub runner has no Ableton Live and no
  # Accessibility grant, which is exactly why `permission` must come back as a
  # well-formed refusal rather than a crash.
  helper:
    name: Build the macOS Accessibility helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile native/seshat_ax/main.m
        run: |
          /usr/bin/clang -fobjc-arc -Wall -Wextra -Werror -O2 \
            -framework AppKit -framework ApplicationServices \
            -o "$RUNNER_TEMP/seshat-ax" native/seshat_ax/main.m

      - name: An untrusted runner reports permission_required, in protocol
        run: |
          set +e
          OUTPUT=$("$RUNNER_TEMP/seshat-ax" permission)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::permission exited 0 on a runner that cannot be trusted."
            exit 1
          fi
          echo "$OUTPUT" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          assert payload["ok"] is False, payload
          assert payload["code"] == "permission_required", payload
          assert payload["trusted"] is False, payload
          assert payload["protocol_version"] == 1, payload
          print("permission_required reported in protocol")
          '
